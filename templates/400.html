{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/gif" href="{% static 'images/renote_logo_icon.gif' %}">
  <link rel="apple-touch-icon" href="{% static 'images/renote_logo_icon.gif' %}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 — Malformed Request | ReNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/shared/base.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="{% static 'css/shared/error.css' %}?v={% now 'U' %}">
</head>
<body class="error-body">

<main class="error-shell">
  <div class="error-card">
    <a href="{% url 'home:home' %}" class="error-brand" title="Return to ReNote Home">
      <img src="{% static 'images/renote_logo_icon.gif' %}" alt="ReNote" width="38" height="38" style="width:38px;height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;">
      <span>ReNote</span>
    </a>

    <div class="error-visual">
      <div class="error-orb-glow" style="background: radial-gradient(circle, rgba(168, 85, 247, 0.4), transparent 70%);"></div>
      <div class="error-orb-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
    </div>

    <div class="error-code">400</div>
    <h1 class="error-title">Malformed Request</h1>
    <p class="error-desc">
      The request sent could not be understood or processed by the server. Please check the URL parameters or return to the main dashboard.
    </p>

    <div class="error-actions">
      <a href="{% url 'home:home' %}" class="btn-primary-glow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Return to Dashboard</span>
      </a>
      <a href="{% url 'library:list' %}" class="btn-secondary-glow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
        <span>My Library</span>
      </a>
    </div>

    <div class="error-quick-links">
      <span>Need coordinates?</span>
      <a href="{% url 'library:add' %}">Search Titles</a>
      <span>·</span>
      <a href="{% url 'home:home' %}">Dashboard</a>
    </div>
  </div>
</main>

</body>
</html>
