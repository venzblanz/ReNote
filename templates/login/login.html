{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/gif" href="{% static 'images/renote_logo_icon.gif' %}">
  <link rel="apple-touch-icon" href="{% static 'images/renote_logo_icon.gif' %}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReNote — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/shared/base.css' %}">
<link rel="stylesheet" href="{% static 'css/shared/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/login/login.css' %}">
</head>
<body>


  <main class="auth-shell">
    <a href="{% url 'home:home' %}" class="logo">
      <img src="{% static 'images/renote_logo_icon.gif' %}" alt="ReNote" class="brand-logo-icon" width="38" height="38" style="width:38px;height:38px;min-width:38px;min-height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;">
      <span class="brand">ReNote</span>
    </a>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Pick up right where you left off.</p>

      {% if form.non_field_errors %}
        <div class="form-alert" role="alert">{{ form.non_field_errors.0 }}</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="field">
          <label for="id_username">Username or email</label>
          <input type="text" id="id_username" name="username" placeholder="yourname" autocomplete="username" required autofocus>
        </div>

        <div class="field">
          <label for="id_password">Password</label>
          <div class="password-field">
            <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="{% url 'login:password_reset' %}" class="link-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn-auth">Log in</button>
      </form>

      <p class="auth-switch">New to ReNote? <a href="{% url 'register:register' %}">Create an account</a></p>
    </div>
  </main>

<script src="{% static 'js/login/login.js' %}"></script>
</body>
</html>
