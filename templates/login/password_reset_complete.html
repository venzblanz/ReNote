{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/gif" href="{% static 'images/renote_logo_icon.gif' %}">
  <link rel="apple-touch-icon" href="{% static 'images/renote_logo_icon.gif' %}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReNote — Password Reset Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/shared/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/shared/auth.css' %}">
</head>
<body>

  <main class="auth-shell">
    <a href="{% url 'home:home' %}" class="logo">
      <img src="{% static 'images/renote_logo_icon.gif' %}" alt="ReNote" class="brand-logo-icon" width="38" height="38" style="width:38px;height:38px;min-width:38px;min-height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;">
      <span class="brand">ReNote</span>
    </a>

    <div class="auth-card" style="text-align: center;">
      <div style="width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; color: #22c55e;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1>Password updated!</h1>
      <p class="auth-sub" style="margin-left: auto; margin-right: auto; margin-bottom: 28px;">
        Your password has been changed successfully. You may now sign in to your ReNote account.
      </p>

      <a href="{% url 'login:login' %}" class="btn-auth" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">Log in to ReNote</a>
    </div>
  </main>

</body>
</html>
